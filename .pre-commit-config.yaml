# Checks that run on every `git commit`. `make setup` turns them on.
# If one fails, it may have fixed the file for you: look, `git add` it, and commit again.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Ruff and Django run through uv, so they use the versions in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, fixes what it can)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: django-check
        name: django check
        entry: uv run python manage.py check
        language: system
        types: [python]
        pass_filenames: false
