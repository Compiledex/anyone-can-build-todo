{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>

  <form class="account" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>

  <p><a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
