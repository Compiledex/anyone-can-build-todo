{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
  <h1>Create an account</h1>

  <form class="account" method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Sign up</button>
  </form>

  <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
