<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}To-do list{% endblock %}</title>
  <link rel="icon" href="data:,">
  <style>
    /* Colors. The page follows the system's light or dark mode. Every new color needs a dark
       value too, with at least 4.5 : 1 contrast on --bg in both modes (WCAG AA). */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --border: #dddddd;
      --overdue: #b00020;
      --priority-high: #a14a00;
      --tag-bg: #e6eef8;
      --tag-text: #1d3b5c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #e8e8e8;
        --muted: #a0a0a0;
        --border: #3a3a3a;
        --overdue: #ff6b6b;
        --priority-high: #ffb366;
        --tag-bg: #233447;
        --tag-text: #cfe1f5;
      }
    }
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem;
           background: var(--bg); color: var(--text); }
    a { color: var(--text); }
    nav.lists { margin: 1rem 0; }
    nav.lists .menu { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0 0 0.5rem; }
    .menu-label, .muted { color: var(--muted); }
    nav.lists a[aria-current="page"] { font-weight: bold; text-decoration: none; }
    .list-actions { display: flex; gap: 1rem; margin-top: -0.5rem; }
    .messages { margin-bottom: 1rem; }
    .message { margin: 0 0 0.5rem; padding: 0.5rem; border: 1px solid var(--border); }
    .errorlist { list-style: none; padding: 0; margin: 0 0 0.5rem; }
    header.site { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
                  padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); color: var(--muted); }
    form.account div, form.edit div { margin-bottom: 0.75rem; }
    form.account label, form.edit label { display: block; margin-bottom: 0.25rem; }
    form.account input, form.edit input { box-sizing: border-box; width: 100%; padding: 0.5rem; font-size: 1rem; }
    form.account .helptext, form.account .helptext ul { color: var(--muted); font-size: 0.85rem; }
    form.add { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    form.add input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    form.add input[type=date] { flex: 0 0 auto; }
    form.add select { padding: 0.5rem; font-size: 1rem; }
    ul.todos, ul.members { list-style: none; padding: 0; }
    .sharing { margin-top: 2rem; }
    ul.todos > li, ul.members > li { display: flex; align-items: center; gap: 0.5rem;
                                     padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
    ul.todos > li { flex-wrap: wrap; } /* So the steps can take their own line. */
    li .title, li .main { flex: 1; min-width: 0; }
    .notes { font-size: 0.9rem; color: var(--muted); }
    .repeat { font-size: 0.9rem; color: var(--muted); }
    .notes p { margin: 0.25rem 0 0; overflow-wrap: anywhere; }
    li .tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.25rem; }
    .tag { font-size: 0.8rem; padding: 0.1rem 0.4rem; border-radius: 0.6rem;
           background: var(--tag-bg); color: var(--tag-text); white-space: nowrap; }
    .overdue time, .overdue-label { color: var(--overdue); }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    /* Steps. Only .step-title is crossed out, so a done to-do does not cross out its steps. */
    details.steps { flex-basis: 100%; font-size: 0.9rem; }
    details.steps summary { cursor: pointer; color: var(--muted); }
    ul.steps { list-style: none; margin: 0.25rem 0; padding: 0 0 0 1.5rem; }
    ul.steps li { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; }
    ul.steps .step-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    li.step.done .step-title { text-decoration: line-through; color: var(--muted); }
    details.steps button { padding: 0.2rem 0.5rem; font-size: 0.8rem; }
    form.add-step { display: flex; gap: 0.5rem; margin: 0.25rem 0 0 1.5rem; }
    form.add-step input { flex: 1; min-width: 0; padding: 0.3rem; font-size: 0.9rem; }
    details.clear-completed { margin-top: 1.5rem; padding: 0.5rem; border: 1px solid var(--border); }
    details.clear-completed summary { cursor: pointer; color: var(--muted); }
    details.clear-completed p { margin: 0.5rem 0; }
    /* The priority label. Medium uses the normal text color. */
    .priority { color: var(--text); border: 1px solid currentColor; border-radius: 0.25rem;
                padding: 0 0.3rem; font-size: 0.8rem; white-space: nowrap; }
    .priority-3 { color: var(--priority-high); font-weight: bold; } /* 3 is High */
    .priority-1 { color: var(--muted); } /* 1 is Low */
    li.done .priority { color: var(--muted); }
    /* Hidden on the screen, but read by screen readers. */
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
                       border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    button { padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: pointer; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
    <header class="site">
      <span>Logged in as {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    </header>
  {% endif %}

  {% if messages %}
    <div class="messages" role="status">
      {% for message in messages %}
        <p class="message{% if message.tags %} {{ message.tags }}{% endif %}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
