{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}To-do list{% endblock %}</title>
  <link rel="icon" href="data:,">
  <style>
    /* Colors. The page follows the system's light or dark mode. Every new color needs a dark
       value too, with at least 4.5 : 1 contrast on --bg in both modes (WCAG AA). */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --border: #dddddd;
      --overdue: #b00020;
      --priority-high: #a14a00;
      --tag-bg: #e6eef8;
      --tag-text: #1d3b5c;
      --drag-bg: #eef3fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #e8e8e8;
        --muted: #a0a0a0;
        --border: #3a3a3a;
        --overdue: #ff6b6b;
        --priority-high: #ffb366;
        --tag-bg: #233447;
        --tag-text: #cfe1f5;
        --drag-bg: #1f2a36;
      }
    }
  </style>
  <link rel="stylesheet" href="{% static 'todos/app.css' %}">
</head>
<body>
  {% if user.is_authenticated %}
    <header class="site">
      <span>Logged in as {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    </header>
  {% endif %}

  {% if messages %}
    <div class="messages" role="status">
      {% for message in messages %}
        <p class="message{% if message.tags %} {{ message.tags }}{% endif %}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
