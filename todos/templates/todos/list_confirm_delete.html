{% extends "base.html" %}

{% block title %}Delete list{% endblock %}

{% block content %}
  <h1>Delete “{{ the_list.name }}” and its {{ todo_count }} to-do{{ todo_count|pluralize }}?</h1>
  <p>This cannot be undone.</p>
  <form method="post" action="{% url 'list_delete' the_list.pk %}">
    {% csrf_token %}
    <button type="submit">Delete list</button>
    <a href="{{ the_list.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
